<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CypherNode UI</title><style>:root{--bg:#f6f8fb;--card:#fff;--muted:#6b7280;--accent:#2563eb;--danger:#ef4444;--glass:rgba(255,255,255,.6);--rad:12px;--sh:0 6px 18px rgba(16,24,40,.06);font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f8fafc,var(--bg));color:#0f172a;display:flex;justify-content:center;padding:28px}.app{width:100%;max-width:1100px;display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}@media(max-width:880px){.app{grid-template-columns:1fr;padding:12px}.sidebar{position:sticky;top:12px;z-index:3}}.sidebar{background:linear-gradient(180deg,var(--card),rgba(246,248,253,.8));border-radius:var(--rad);box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid rgba(16,24,40,.04)}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}.brand h1{margin:0;font-size:16px}.brand p{margin:0;font-size:12px;color:var(--muted)}.nav{display:flex;gap:8px;margin-top:6px}.nav button{flex:1;padding:10px;border-radius:10px;border:none;background:0 0;cursor:pointer;font-weight:600;color:var(--muted);transition:.2s}.nav button.act{background:rgba(37,99,235,.08);color:var(--accent)}.stat-row{display:flex;gap:8px}.stat{flex:1;background:var(--card);padding:10px;border-radius:10px;text-align:center;box-shadow:0 3px 10px rgba(2,6,23,.03)}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:18px;margin-top:6px}.main{display:flex;flex-direction:column;gap:18px}.panel{background:var(--card);border-radius:var(--rad);padding:16px;box-shadow:var(--sh);border:1px solid rgba(2,6,23,.03)}.panel h2{margin:0 0 8px;font-size:18px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.devices{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.device{border-radius:12px;padding:12px;background:linear-gradient(180deg,#fff,var(--glass));display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 20px rgba(2,6,23,.04);transition:.15s}.device:hover{transform:translateY(-4px)}.device .title{display:flex;justify-content:space-between;align-items:center;gap:8px}.device .meta{font-size:13px;color:var(--muted)}.device .pi{font-size:14px;font-weight:700}.device .actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}.sw{--w:46px;--h:26px;position:relative;width:var(--w);height:var(--h)}.sw input{opacity:0;width:0;height:0}.sw .track{position:absolute;inset:0;background:#e6e8eb;border-radius:99px;transition:.2s;padding:3px}.sw .thumb{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s;display:block}.sw input:checked+.track{background:linear-gradient(90deg,var(--accent),#7c3aed)}.sw input:checked+.track .thumb{transform:translateX(20px)}.row{display:flex;gap:8px}.col{flex:1}label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}input[type=text],select{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(2,6,23,.06);background:0 0;font-size:14px}.muted{color:var(--muted);font-size:13px}.btn{padding:10px 14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.btn.gh{background:0 0;color:var(--accent);border:1px solid rgba(37,99,235,.12)}.btn.dan{background:var(--danger)}.hint{font-size:13px;color:#ef4444;margin-top:6px}.small{font-size:13px;color:var(--muted)}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#0b1220;color:#fff;padding:10px 14px;border-radius:10px;display:none}.toast.show{display:block}.empty{text-align:center;color:var(--muted);padding:26px;border-radius:8px;background:rgba(2,6,23,.02)}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">CN</div><div><h1>CypherNode</h1><p>Smart Home</p></div></div><div class="nav"><button id="tb-db" class="act">Dashboard</button><button id="tb-cfg">Settings</button></div><div class="stat-row"><div class="stat"><small>Total Loads</small><strong id="st-c">0</strong></div><div class="stat"><small>Online</small><strong id="st-o">0 ON</strong></div></div><div class="small">Polling: <span id="p-st">active</span></div></aside><main class="main"><section id="p-db" class="panel"><h2>My Devices</h2><div class="controls"><button id="btn-ref" class="btn gh">Refresh</button><div style="flex:1"></div><div class="small muted">Update: <span id="l-up">...</span></div></div><div id="dev-w" class="devices"><div class="empty">Loading...</div></div></section><section id="p-cfg" class="panel" style="display:none"><h2>Configuration</h2><div id="cfg-l" style="margin-bottom:12px"></div><div style="border-radius:12px;padding:12px;background:rgba(246,248,253,.8);display:flex;flex-direction:column;gap:12px"><strong>Add / Update Load</strong><div class="row"><div class="col"><label>Load ID (Unique)</label><input id="n-id" type="text" placeholder="room1"></div><div class="col"><label>Display Name</label><input id="n-nm" type="text" placeholder="Light"></div></div><div class="row"><div class="col"><label>Device Type</label><select id="n-ty"><option value="light">💡 Light</option><option value="fan">🌀 Fan</option><option value="ac">❄️ AC</option><option value="tv">📺 TV</option><option value="socket">🔌 Socket</option></select></div></div><div class="row"><div class="col"><label>Relay GPIO</label><select id="n-re"></select></div><div class="col"><label style="display:flex;align-items:center;gap:8px"><input id="n-hsw" type="checkbox"> Has Switch</label><select id="n-sw" disabled><option value="">Select PIN</option></select></div></div><div class="row"><button id="btn-add" class="btn">Add & Save</button><button id="btn-clr" class="btn gh">Clear</button></div><div id="f-err" class="hint" style="display:none"></div></div></section></main></div><div id="toast" class="toast"></div><script>let cfg=[], st={}, pInt=null;const $ = s => document.querySelector(s), icn = {light:'💡',fan:'🌀',ac:'❄️',tv:'📺',socket:'🔌'}, pins = [2,4,5,12,13,14,15,16,17,18,19,21,22,23,25,26,27,32,33], swP = [...pins,34,35,36,39], eId=$('#n-id'), eNm=$('#n-nm'), eTy=$('#n-ty'), eRe=$('#n-re'), eHsw=$('#n-hsw'), eSw=$('#n-sw'), esc = s => String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), tst = m => { let t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }, err = m => { let e=$('#f-err'); e.textContent=m; e.style.display='block'; }, rReq = async (u,b) => { try{ let r=await fetch(u,b?{method:'POST',body:JSON.stringify(b)}:undefined); return r.ok?await r.json():null }catch(e){} }, rTxt = async (u,b) => { try{ await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}) }catch(e){} };pins.forEach(p=>eRe.innerHTML+=`<option value="${p}">GPIO ${p}</option>`);swP.forEach(p=>eSw.innerHTML+=`<option value="${p}">GPIO ${p}</option>`);eHsw.onchange=()=>{eSw.disabled=!eHsw.checked; if(!eHsw.checked)eSw.value=''};const sTab = t => { let isD = t==='db'; $('#p-db').style.display = isD?'':'none'; $('#p-cfg').style.display = isD?'none':''; $('#tb-db').classList.toggle('act',isD); $('#tb-cfg').classList.toggle('act',!isD); isD ? sPol() : (clearInterval(pInt), pInt=null, $('#p-st').textContent='paused');};$('#tb-db').onclick=()=>sTab('db'); $('#tb-cfg').onclick=()=>sTab('cfg');const ldCfg = async () => { let d = await rReq('/get-config'); cfg = Array.isArray(d)?d:[]; $('#st-c').textContent = cfg.length; rCfgL(); rDev();};const rCfgL = () => { let h = cfg.map((d,i)=>`<div class="panel" style="margin-bottom:8px;padding:12px"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong>${icn[d.loadType]||'💡'} ${esc(d.loadName)}</strong><span class="muted">(${esc(d.loadID)})</span><br><span class="muted" style="font-size:12px">Relay: GPIO ${d.loadGPIO} | Switch: ${d.hasPhysicalSwitch?d.switchGPIO:'None'}</span></div><div class="row"><button class="btn gh" onclick="edLd(${i})">Edit</button><button class="btn dan" onclick="delLd(${i})">Del</button></div></div></div>`).join(''); $('#cfg-l').innerHTML = h||'<div class="empty">No loads configured.</div>';};window.edLd = i => { let d=cfg[i]; eId.value=d.loadID; eId.disabled=1; eNm.value=d.loadName; eTy.value=d.loadType||'light'; eRe.value=d.loadGPIO; eHsw.checked=d.hasPhysicalSwitch; eSw.disabled=!d.hasPhysicalSwitch; eSw.value=d.hasPhysicalSwitch?d.switchGPIO:''; $('#btn-add').textContent='Update & Save'; $('#btn-add').dataset.i=i; sTab('cfg');};const clrF = () => { eId.value=''; eId.disabled=0; eNm.value=''; eTy.value='light'; eRe.value=pins[0]; eHsw.checked=0; eSw.disabled=1; eSw.value=''; $('#btn-add').textContent='Add & Save'; delete $('#btn-add').dataset.i; $('#f-err').style.display='none';};$('#btn-clr').onclick=clrF;$('#btn-add').onclick = async () => { $('#f-err').style.display='none'; let id=eId.value.trim(), nm=eNm.value.trim(), ty=eTy.value, re=+eRe.value, hSw=eHsw.checked, swP=hSw?+eSw.value:null, i=$('#btn-add').dataset.i; if(!id||!nm)return err('ID & Name req'); if(hSw&&isNaN(swP))return err('Select Sw PIN'); if(hSw&&swP===re)return err('Relay & Sw pins must differ'); let eIdx = i!==undefined?+i:-1; if(cfg.some((c,x)=>c.loadID===id&&x!==eIdx))return err('ID must be unique'); const used = p => cfg.some((c,x)=>x!==eIdx&&(c.loadGPIO===p||(c.hasPhysicalSwitch&&c.switchGPIO===p))); if(used(re)|| (hSw&&used(swP)))return err('GPIO already in use'); let en = {loadID:id,loadName:nm,loadType:ty,loadGPIO:re,hasPhysicalSwitch:hSw,switchGPIO:hSw?swP:-1}; eIdx>=0 ? cfg[eIdx]=en : cfg.push(en); await rTxt('/save-config',cfg); tst('Saved!'); clrF(); ldCfg();};window.delLd = async i => { let d=cfg[i], o=st[d.loadID]===1; if(o&&!confirm(`Turn OFF and delete '${d.loadName}'?`))return; if(!o&&!confirm(`Delete '${d.loadName}'?`))return; if(o) await rReq('/update', {[d.loadID]:0}); cfg.splice(i,1); await rTxt('/save-config',cfg); tst('Deleted'); ldCfg();};const rDev = () => { let h = cfg.map(d=>`<div class="device"><div class="title"><div><div class="pi">${icn[d.loadType]||'💡'} ${esc(d.loadName)}</div><div class="meta">${esc(d.loadID)}</div></div><div class="muted" style="font-size:12px">Relay:${d.loadGPIO}</div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div class="meta">${d.hasPhysicalSwitch?'Has Switch':'No Switch'}</div><label class="sw"><input type="checkbox" id="sw-${esc(d.loadID)}" ${st[d.loadID]===1?'checked':''} onchange="tgLd('${esc(d.loadID)}',this)"><span class="track"><span class="thumb"></span></span></label></div><div class="actions"><div class="muted" style="font-size:13px">Sw:${d.hasPhysicalSwitch?'GPIO '+d.switchGPIO:'—'}</div><div class="row"><button class="btn gh" onclick="rnLd('${esc(d.loadID)}')">Rename</button><button class="btn" onclick="pLd('${esc(d.loadID)}')">Pulse</button></div></div></div>`).join(''); $('#dev-w').innerHTML = h||'<div class="empty">No devices.</div>';};window.tgLd = async (id, el) => { let v = el.checked?1:0; st[id]=v; uSts(); let r = await rReq('/update', {[id]:v}); if(r===null){ tst('Fail'); el.checked=!v; st[id]=v?0:1; uSts(); }};window.rnLd = async id => { let d = cfg.find(x=>x.loadID===id), nn = prompt('New name:', d?.loadName); if(nn&&nn.trim()){ d.loadName=nn.trim(); await rTxt('/save-config',cfg); ldCfg(); }};window.pLd = async id => { await rReq('/update',{[id]:1}); setTimeout(()=>rReq('/update',{[id]:0}),300); setTimeout(()=>rReq('/update',{[id]:1}),900); tst('Pulsed');};const fSt = async () => { let d = await rReq('/state'); if(d&&typeof d==='object'){ st=d; $('#l-up').textContent=new Date().toLocaleTimeString(); for(let k in st){ let el=$('#sw-'+k); if(el) el.checked=(st[k]===1); } uSts(); }};const sPol = () => { if(!pInt)pInt=setInterval(fSt,1500); fSt(); $('#p-st').textContent='active'; };const uSts = () => $('#st-o').textContent = Object.values(st).filter(v=>v===1).length+' ON';$('#btn-ref').onclick = fSt;ldCfg().then(()=>sTab('db'));</script></body></html>
